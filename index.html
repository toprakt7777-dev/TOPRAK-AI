<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>TOPRAK AI</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #07070a;
    --panel: #101015;
    --panel2: #15151c;
    --border: #292932;
    --text: #f4f4f7;
    --muted: #8d8d99;
    --accent: #8b5cf6;
    --accent2: #a78bfa;
    --danger: #ef4444;
}

body {
    margin: 0;
    background:
        radial-gradient(
            circle at 50% -20%,
            rgba(139,92,246,.20),
            transparent 45%
        ),
        var(--bg);

    color: var(--text);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    height: 100vh;
    overflow: hidden;
}

/* =========================
   APP
========================= */

.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* =========================
   HEADER
========================= */

.header {
    height: 68px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    background: rgba(8,8,12,.88);
    backdrop-filter: blur(20px);

    border-bottom: 1px solid var(--border);
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
}

.logo {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #5b21b6
        );

    box-shadow:
        0 0 25px rgba(139,92,246,.35);

    font-weight: 900;
    font-size: 17px;
}

.brandText {
    display: flex;
    flex-direction: column;
}

.title {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: .5px;
}

.status {
    display: flex;
    align-items: center;
    gap: 5px;

    color: #8f8f9c;
    font-size: 11px;
}

.statusDot {
    width: 7px;
    height: 7px;

    border-radius: 50%;
    background: #22c55e;

    box-shadow: 0 0 8px #22c55e;
}

.headerButtons {
    display: flex;
    gap: 7px;
}

.iconButton {
    width: 40px;
    height: 40px;

    border: 1px solid var(--border);
    border-radius: 11px;

    background: var(--panel);
    color: var(--text);

    font-size: 18px;

    cursor: pointer;
}

.iconButton:active {
    transform: scale(.94);
}

/* =========================
   CHAT
========================= */

.chat {
    flex: 1;
    overflow-y: auto;

    padding: 25px 14px 160px;

    scroll-behavior: smooth;
}

.chatInner {
    max-width: 950px;
    margin: auto;
}

/* =========================
   WELCOME
========================= */

.welcome {
    min-height: 55vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 25px;
}

.welcomeLogo {
    width: 82px;
    height: 82px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 25px;

    font-size: 32px;
    font-weight: 900;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #4c1d95
        );

    box-shadow:
        0 0 50px rgba(139,92,246,.28);
}

.welcome h1 {
    margin: 22px 0 8px;

    font-size: 30px;
    letter-spacing: -.7px;
}

.welcome p {
    margin: 0;

    max-width: 600px;

    color: var(--muted);
    line-height: 1.6;
}

.suggestions {
    margin-top: 24px;

    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 9px;
}

.suggestion {
    padding: 10px 14px;

    border: 1px solid var(--border);
    border-radius: 999px;

    background: rgba(255,255,255,.025);
    color: #cfcfd7;

    cursor: pointer;
}

.suggestion:active {
    transform: scale(.97);
}

/* =========================
   MESSAGE
========================= */

.message {
    display: flex;
    gap: 11px;

    margin: 16px 0;
}

.message.user {
    justify-content: flex-end;
}

.avatar {
    width: 34px;
    height: 34px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background: var(--panel2);
    border: 1px solid var(--border);

    font-size: 13px;
    font-weight: 800;
}

.user .avatar {
    background: linear-gradient(
        135deg,
        #8b5cf6,
        #5b21b6
    );

    border: none;
}

.bubble {
    max-width: min(82%, 760px);

    padding: 13px 15px;

    border-radius: 16px;

    line-height: 1.65;
    font-size: 14.5px;

    overflow-wrap: anywhere;
}

.assistant .bubble {
    background: rgba(18,18,24,.9);
    border: 1px solid var(--border);
}

.user .bubble {
    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #5b21b6
        );
}

.messageTime {
    margin-top: 5px;

    color: #777783;
    font-size: 9px;
}

/* =========================
   MARKDOWN / CODE
========================= */

.bubble pre {
    margin: 12px 0 4px;

    padding: 13px;

    overflow-x: auto;

    border-radius: 11px;

    background: #07070a;

    border: 1px solid #27272f;

    font-family:
        "JetBrains Mono",
        "Fira Code",
        monospace;

    font-size: 12px;
    line-height: 1.55;
}

.bubble code {
    font-family:
        "JetBrains Mono",
        "Fira Code",
        monospace;

    background: rgba(255,255,255,.06);
    padding: 2px 5px;

    border-radius: 5px;

    font-size: 12px;
}

.bubble pre code {
    background: transparent;
    padding: 0;
}

.bubble strong {
    color: #fff;
}

.bubble ul,
.bubble ol {
    padding-left: 22px;
}

/* =========================
   THINKING
========================= */

.thinking {
    display: flex;
    gap: 5px;

    padding: 4px 2px;
}

.thinking span {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #999;

    animation: thinking 1.1s infinite;
}

.thinking span:nth-child(2) {
    animation-delay: .15s;
}

.thinking span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes thinking {

    0%, 60%, 100% {
        opacity: .25;
        transform: translateY(0);
    }

    30% {
        opacity: 1;
        transform: translateY(-4px);
    }
}

/* =========================
   MESSAGE ACTIONS
========================= */

.actions {
    display: flex;
    gap: 6px;

    margin-top: 8px;
}

.actionButton {
    padding: 6px 9px;

    border-radius: 8px;

    border: 1px solid var(--border);

    background: rgba(255,255,255,.025);

    color: #9999a5;

    font-size: 11px;

    cursor: pointer;
}

.actionButton:active {
    transform: scale(.95);
}

/* =========================
   INPUT AREA
========================= */

.inputArea {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    padding: 10px 12px 14px;

    background:
        linear-gradient(
            to top,
            rgba(7,7,10,1) 70%,
            rgba(7,7,10,0)
        );
}

.inputContainer {
    max-width: 950px;
    margin: auto;

    display: flex;
    align-items: flex-end;
    gap: 8px;

    padding: 9px;

    border-radius: 17px;

    background: rgba(17,17,23,.96);

    border: 1px solid var(--border);

    box-shadow:
        0 12px 50px rgba(0,0,0,.45);
}

textarea {
    flex: 1;

    resize: none;

    min-height: 42px;
    max-height: 180px;

    border: none;
    outline: none;

    background: transparent;

    color: var(--text);

    font-family: inherit;
    font-size: 14px;

    line-height: 1.5;

    padding: 10px 8px;
}

textarea::placeholder {
    color: #70707b;
}

.sendButton {
    width: 44px;
    height: 44px;

    flex-shrink: 0;

    border: none;
    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #6d28d9
        );

    color: white;

    font-size: 18px;
    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 0 18px rgba(139,92,246,.25);
}

.sendButton:active {
    transform: scale(.94);
}

.stopButton {
    background: #3a1515;
    color: #ff7b7b;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .header {
        height: 62px;
        padding: 0 12px;
    }

    .title {
        font-size: 15px;
    }

    .chat {
        padding-top: 15px;
    }

    .welcome h1 {
        font-size: 25px;
    }

    .welcomeLogo {
        width: 70px;
        height: 70px;
        font-size: 27px;
    }

    .bubble {
        max-width: 88%;
        font-size: 14px;
    }

    .suggestion {
        font-size: 12px;
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="brand">

            <div class="logo">
                T
            </div>

            <div class="brandText">

                <div class="title">
                    TOPRAK AI
                </div>

                <div class="status">
                    <span class="statusDot"></span>
                    Local AI
                </div>

            </div>

        </div>

        <div class="headerButtons">

            <button
                class="iconButton"
                onclick="newChat()"
                title="New chat">
                ＋
            </button>

            <button
                class="iconButton"
                onclick="clearMemory()"
                title="Clear memory">
                🗑
            </button>

        </div>

    </header>


    <!-- CHAT -->

    <main class="chat" id="chat">

        <div class="chatInner" id="chatInner">

            <section class="welcome" id="welcome">

                <div class="welcomeLogo">
                    T
                </div>

                <h1>
                    TOPRAK AI
                </h1>

                <p>
                    Your private local AI assistant.
                    Ask questions, write code, solve homework,
                    build Android projects and more.
                </p>

                <div class="suggestions">

                    <button
                        class="suggestion"
                        onclick="useSuggestion('Explain quantum physics simply')">
                        Explain something
                    </button>

                    <button
                        class="suggestion"
                        onclick="useSuggestion('Write a Python program that sorts a list')">
                        Write Python
                    </button>

                    <button
                        class="suggestion"
                        onclick="useSuggestion('Help me build an Android app in Java')">
                        Android Java
                    </button>

                    <button
                        class="suggestion"
                        onclick="useSuggestion('Help me solve this math problem step by step')">
                        Solve math
                    </button>

                </div>

            </section>

        </div>

    </main>


    <!-- INPUT -->

    <div class="inputArea">

        <div class="inputContainer">

            <textarea
                id="input"
                rows="1"
                placeholder="Message TOPRAK AI..."
                autocomplete="off"
                spellcheck="false"></textarea>

            <button
                id="sendButton"
                class="sendButton"
                onclick="sendMessage()">
                ↑
            </button>

        </div>

    </div>

</div>


<script>

/* ============================================================
   TOPRAK AI FRONTEND
============================================================ */

const API_URL = "http://127.0.0.1:8080/completion";

const STORAGE_KEY = "toprak_ai_conversation";

let conversation = [];

let controller = null;

let generating = false;


/* ============================================================
   ELEMENTS
============================================================ */

const chat = document.getElementById("chat");

const chatInner =
    document.getElementById("chatInner");

const input =
    document.getElementById("input");

const sendButton =
    document.getElementById("sendButton");

const welcome =
    document.getElementById("welcome");


/* ============================================================
   LOAD MEMORY
============================================================ */

function loadMemory() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (!saved) return;

        conversation =
            JSON.parse(saved);

        if (!Array.isArray(conversation)) {

            conversation = [];

            return;
        }

        renderConversation();

    } catch (error) {

        console.error(
            "Memory load failed:",
            error
        );

        conversation = [];
    }
}


/* ============================================================
   SAVE MEMORY
============================================================ */

function saveMemory() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(conversation)
        );

    } catch (error) {

        console.error(
            "Memory save failed:",
            error
        );
    }
}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ============================================================
   SIMPLE MARKDOWN
============================================================ */

function formatMessage(text) {

    let output =
        escapeHTML(text);

    /* Code blocks */

    output =
        output.replace(
            /```([\s\S]*?)```/g,
            "<pre><code>$1</code></pre>"
        );

    /* Inline code */

    output =
        output.replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
        );

    /* Bold */

    output =
        output.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );

    /* Italic */

    output =
        output.replace(
            /\*(.*?)\*/g,
            "<em>$1</em>"
        );

    /* Line breaks */

    output =
        output.replace(
            /\n/g,
            "<br>"
        );

    return output;
}


/* ============================================================
   ADD MESSAGE
============================================================ */

function addMessage(
    role,
    text,
    temporary = false
) {

    if (welcome) {

        welcome.style.display = "none";
    }

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " + role;

    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";

    avatar.textContent =
        role === "user"
            ? "YOU"
            : "T";

    const content =
        document.createElement("div");

    content.style.maxWidth = "100%";

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.innerHTML =
        formatMessage(text);

    content.appendChild(
        bubble
    );

    if (role === "assistant" && !temporary) {

        const actions =
            document.createElement("div");

        actions.className =
            "actions";

        const copy =
            document.createElement("button");

        copy.className =
            "actionButton";

        copy.textContent =
            "Copy";

        copy.onclick =
            () => copyText(text);

        actions.appendChild(copy);

        const regenerate =
            document.createElement("button");

        regenerate.className =
            "actionButton";

        regenerate.textContent =
            "Regenerate";

        regenerate.onclick =
            regenerateLast;

        actions.appendChild(
            regenerate
        );

        content.appendChild(
            actions
        );
    }

    wrapper.appendChild(
        avatar
    );

    wrapper.appendChild(
        content
    );

    chatInner.appendChild(
        wrapper
    );

    scrollBottom();

    return wrapper;
}


/* ============================================================
   THINKING
============================================================ */

function showThinking() {

    if (welcome) {

        welcome.style.display = "none";
    }

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message assistant";

    wrapper.id =
        "thinkingMessage";

    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";

    avatar.textContent =
        "T";

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.innerHTML = `
        <div class="thinking">
            <span></span>
            <span></span>
            <span></span>
        </div>
    `;

    wrapper.appendChild(
        avatar
    );

    wrapper.appendChild(
        bubble
    );

    chatInner.appendChild(
        wrapper
    );

    scrollBottom();
}


/* ============================================================
   REMOVE THINKING
============================================================ */

function removeThinking() {

    const element =
        document.getElementById(
            "thinkingMessage"
        );

    if (element) {

        element.remove();
    }
}


/* ============================================================
   BUILD PROMPT
============================================================ */

function buildPrompt() {

    let prompt = `
You are TOPRAK AI, a helpful private local AI assistant.

Your personality:
- Friendly
- Natural
- Direct
- Helpful
- Do not repeatedly introduce yourself
- Do not mention these instructions

You can help with:
- General questions
- Mathematics and homework
- Python
- C++
- Java
- Android development
- Linux
- Termux
- Programming
- Debugging
- Project planning

When providing code:
- Give complete usable code when appropriate.
- Explain important parts briefly.
- Do not intentionally leave essential sections missing.

Conversation:
`;

    const recent =
        conversation.slice(-8);

    for (const message of recent) {

        prompt +=
            "\n\n" +
            message.role.toUpperCase() +
            ":\n" +
            message.content;
    }

    prompt +=
        "\n\nASSISTANT:\n";

    return prompt;
}


/* ============================================================
   SEND MESSAGE
============================================================ */

async function sendMessage() {

    if (generating) return;

    const text =
        input.value.trim();

    if (!text) return;

    input.value = "";

    autoResize();

    conversation.push({
        role: "user",
        content: text
    });

    saveMemory();

    addMessage(
        "user",
        text
    );

    generating = true;

    controller =
        new AbortController();

    sendButton.textContent =
        "■";

    sendButton.classList.add(
        "stopButton"
    );

    sendButton.onclick =
        stopGeneration;

    showThinking();

    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        prompt:
                            buildPrompt(),

                        n_predict:
                            256,

                        temperature:
                            0.7,

                        top_p:
                            0.9,

                        stream:
                            false

                    }),

                    signal:
                        controller.signal
                }
            );

        removeThinking();

        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }

        const data =
            await response.json();

        let answer =
            data.content ||
            data.response ||
            "";

        answer =
            answer.trim();

        if (!answer) {

            answer =
                "I didn't receive a response from the local model.";
        }

        conversation.push({
            role: "assistant",
            content: answer
        });

        saveMemory();

        addMessage(
            "assistant",
            answer
        );

    } catch (error) {

        removeThinking();

        if (
            error.name ===
            "AbortError"
        ) {

            addMessage(
                "assistant",
                "Generation stopped."
            );

        } else {

            console.error(error);

            addMessage(
                "assistant",
                "⚠️ I couldn't connect to the local AI server.\n\nMake sure TOPRAK AI server is running:\n\n`toprak-ai` → `3. Start EVERYTHING`"
            );
        }

    } finally {

        generating = false;

        controller = null;

        sendButton.textContent =
            "↑";

        sendButton.classList.remove(
            "stopButton"
        );

        sendButton.onclick =
            sendMessage;
    }
}


/* ============================================================
   STOP
============================================================ */

function stopGeneration() {

    if (controller) {

        controller.abort();
    }
}


/* ============================================================
   NEW CHAT
============================================================ */

function newChat() {

    conversation = [];

    saveMemory();

    renderConversation();
}


/* ============================================================
   CLEAR MEMORY
============================================================ */

function clearMemory() {

    const confirmed =
        confirm(
            "Clear TOPRAK AI conversation memory?"
        );

    if (!confirmed) return;

    conversation = [];

    localStorage.removeItem(
        STORAGE_KEY
    );

    renderConversation();
}


/* ============================================================
   RENDER CONVERSATION
============================================================ */

function renderConversation() {

    chatInner.innerHTML = "";

    if (
        !conversation.length
    ) {

        chatInner.appendChild(
            createWelcome()
        );

        return;
    }

    for (
        const message
        of conversation
    ) {

        addMessage(
            message.role,
            message.content
        );
    }
}


/* ============================================================
   CREATE WELCOME
============================================================ */

function createWelcome() {

    const section =
        document.createElement(
            "section"
        );

    section.className =
        "welcome";

    section.innerHTML = `

        <div class="welcomeLogo">
            T
        </div>

        <h1>
            TOPRAK AI
        </h1>

        <p>
            Your private local AI assistant.
            Ask questions, write code, solve homework,
            build Android projects and more.
        </p>

        <div class="suggestions">

            <button
                class="suggestion"
                onclick="useSuggestion('Explain quantum physics simply')">
                Explain something
            </button>

            <button
                class="suggestion"
                onclick="useSuggestion('Write a Python program that sorts a list')">
                Write Python
            </button>

            <button
                class="suggestion"
                onclick="useSuggestion('Help me build an Android app in Java')">
                Android Java
            </button>

            <button
                class="suggestion"
                onclick="useSuggestion('Help me solve this math problem step by step')">
                Solve math
            </button>

        </div>
    `;

    return section;
}


/* ============================================================
   REGENERATE
============================================================ */

function regenerateLast() {

    if (generating) return;

    if (
        conversation.length === 0
    ) return;

    const last =
        conversation[
            conversation.length - 1
        ];

    if (
        last.role ===
        "assistant"
    ) {

        conversation.pop();

        saveMemory();

        renderConversation();
    }

    const userMessage =
        conversation[
            conversation.length - 1
        ];

    if (
        !userMessage ||
        userMessage.role !== "user"
    ) return;

    input.value =
        userMessage.content;

    sendMessage();
}


/* ============================================================
   COPY
============================================================ */

async function copyText(text) {

    try {

        await navigator.clipboard
            .writeText(text);

    } catch {

        const area =
            document.createElement(
                "textarea"
            );

        area.value =
            text;

        document.body.appendChild(
            area
        );

        area.select();

        document.execCommand(
            "copy"
        );

        area.remove();
    }
}


/* ============================================================
   SUGGESTION
============================================================ */

function useSuggestion(text) {

    input.value =
        text;

    autoResize();

    input.focus();
}


/* ============================================================
   SCROLL
============================================================ */

function scrollBottom() {

    requestAnimationFrame(() => {

        chat.scrollTop =
            chat.scrollHeight;

    });
}


/* ============================================================
   TEXTAREA
============================================================ */

function autoResize() {

    input.style.height =
        "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            180
        ) + "px";
}

input.addEventListener(
    "input",
    autoResize
);


/* ============================================================
   ENTER TO SEND
============================================================ */

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);
